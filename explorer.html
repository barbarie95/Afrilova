<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explorer - Rencontres</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #F3FBF7;
      color: #17352B;
      padding-bottom: 85px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: linear-gradient(
        145deg,
        #0B8F6A,
        #3DBB91,
        #E0F7EE
      );

      color: white;
      padding: 20px 16px 28px;
      border-radius: 0 0 28px 28px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .points {
      background: rgba(255,255,255,0.22);
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 14px;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       CONTENU
    ========================= */

    main {
      max-width: 650px;
      margin: auto;
      padding: 18px 15px;
    }

    /* =========================
       RECHERCHE
    ========================= */

    .search-card {
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .search-card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      color: #526960;
      font-size: 13px;
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #CDE7DC;
      border-radius: 12px;
      background: white;
      color: #17352B;
      font-size: 14px;
      outline: none;
    }

    select:focus {
      border-color: #0B8F6A;
    }

    .search-button {
      width: 100%;
      border: none;
      background: #0B8F6A;
      color: white;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       TITRE PROFILS
    ========================= */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title h2 {
      font-size: 21px;
    }

    .result-count {
      color: #087557;
      font-size: 13px;
    }

    /* =========================
       PROFILS
    ========================= */

    #profiles {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .profile-photo {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
      background: #E0F7EE;
    }

    .profile-content {
      padding: 16px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .profile-location {
      color: #087557;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .profile-description {
      color: #536960;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .looking-for {
      display: inline-block;
      background: #E0F7EE;
      color: #087557;
      padding: 7px 10px;
      border-radius: 15px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .view-profile {
      display: block;
      width: 100%;
      padding: 12px;
      background: #0B8F6A;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    /* =========================
       MESSAGE VIDE
    ========================= */

    .empty-message {
      background: white;
      border-radius: 20px;
      padding: 25px 18px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.05);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .empty-message h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .empty-message p {
      color: #65766F;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
      z-index: 1000;
    }

    .nav-link {
      text-decoration: none;
      color: #71827B;
      text-align: center;
      font-size: 12px;
    }

    .nav-link span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    .nav-link.active {
      color: #0B8F6A;
      font-weight: bold;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      header h1 {
        font-size: 24px;
      }

      .profile-photo {
        height: 240px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="top-bar">

      <div class="logo">
        💚 Rencontres
      </div>

      <div class="points">
        ⭐ <span id="points">3</span> points
      </div>

    </div>

    <h1>Explorer 🔎</h1>

    <p>
      Découvrez des personnes qui recherchent l’amour.
    </p>

  </header>


  <main>

    <!-- =========================
         RECHERCHE
    ========================= -->

    <section class="search-card">

      <h2>
        🔎 Rechercher un profil
      </h2>

      <div class="field">

        <label for="country">
          Pays
        </label>

        <select id="country">

          <option value="">
            🌍 Tous les pays
          </option>

        </select>

      </div>


      <div class="field">

        <label for="city">
          Ville
        </label>

        <select id="city" disabled>

          <option value="">
            🏙️ Toutes les villes
          </option>

        </select>

      </div>


      <button
        type="button"
        class="search-button"
        id="searchButton"
      >
        🔎 Rechercher
      </button>

    </section>


    <!-- =========================
         PROFILS
    ========================= -->

    <div class="section-title">

      <h2>
        ❤️ Profils
      </h2>

      <span
        class="result-count"
        id="resultCount"
      ></span>

    </div>


    <section id="profiles">

      <div class="empty-message">

        <div class="empty-icon">
          💚
        </div>

        <h3>
          Les profils arrivent bientôt
        </h3>

        <p>
          Les profils approuvés apparaîtront ici.
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="bottom-nav">

    <a
      href="index.html"
      class="nav-link"
    >
      <span>🏠</span>
      Accueil
    </a>

    <a
      href="explorer.html"
      class="nav-link active"
    >
      <span>🔎</span>
      Explorer
    </a>

    <a
      href="messagerie.html"
      class="nav-link"
    >
      <span>💬</span>
      Messagerie
    </a>

    <a
      href="profil.html"
      class="nav-link"
    >
      <span>👤</span>
      Profil
    </a>

  </nav>


  <!-- =========================
       LOGIQUE APPWRITE
    ========================= -->

  <script>

    /*
     * ==================================================
     * APPWRITE
     * ==================================================
     *
     * La connexion réelle à Appwrite sera ajoutée
     * lorsque notre projet Appwrite sera créé.
     *
     * Aucun identifiant ou secret n'est placé ici
     * pour le moment.
     */


    let profils = [];


    /*
     * ==================================================
     * CHARGER LES PAYS
     * ==================================================
     *
     * Les pays seront récupérés depuis Appwrite.
     *
     * Collection prévue :
     *
     * pays
     *
     * Champs :
     * - nom
     * - code
     * - indicatif
     */

    async function chargerPays() {

      const country =
        document.getElementById("country");

      /*
       * Connexion Appwrite à ajouter
       * après création de la base.
       */

      country.innerHTML = `
        <option value="">
          🌍 Tous les pays
        </option>
      `;

    }


    /*
     * ==================================================
     * CHARGER LES VILLES
     * ==================================================
     */

    async function chargerVilles(paysId) {

      const city =
        document.getElementById("city");

      city.innerHTML = `
        <option value="">
          🏙️ Toutes les villes
        </option>
      `;

      city.disabled = !paysId;

      /*
       * Les villes seront récupérées depuis Appwrite
       * en fonction du pays sélectionné.
       */

    }


    /*
     * ==================================================
     * CHARGER LES PROFILS
     * ==================================================
     */

    async function chargerProfils(
      paysId = "",
      villeId = ""
    ) {

      /*
       * Appwrite récupérera uniquement les profils
       * dont le statut est :
       *
       * "approuve"
       *
       * Les profils refusés ou en attente ne seront
       * jamais affichés publiquement.
       */

      afficherProfils([]);

    }


    /*
     * ==================================================
     * AFFICHER LES PROFILS
     * ==================================================
     */

    function afficherProfils(liste) {

      const container =
        document.getElementById("profiles");

      const resultCount =
        document.getElementById("resultCount");

      container.innerHTML = "";

      resultCount.textContent =
        liste.length +
        " profil" +
        (liste.length > 1 ? "s" : "");


      if (liste.length === 0) {

        container.innerHTML = `

          <div class="empty-message">

            <div class="empty-icon">
              👥
            </div>

            <h3>
              Aucun profil trouvé
            </h3>

            <p>
              Les profils approuvés correspondant
              à votre recherche apparaîtront ici.
            </p>

          </div>

        `;

        return;
      }


      liste.forEach(profil => {

        const card =
          document.createElement("article");

        card.className = "profile-card";


        card.innerHTML = `

          <img
            class="profile-photo"
            src="${profil.photo_url || ""}"
            alt="Photo de profil"
            loading="lazy"
          >

          <div class="profile-content">

            <div class="profile-name">
              ${profil.nom || "Membre"}
              ${profil.age ? ", " + profil.age + " ans" : ""}
            </div>

            <div class="profile-location">
              📍 ${profil.ville || ""}
              ${profil.ville && profil.pays ? ", " : ""}
              ${profil.pays || ""}
            </div>

            <div class="profile-description">
              ${profil.description || ""}
            </div>

            <div class="looking-for">
              ❤️ ${profil.recherche || "À la recherche de l’amour"}
            </div>

            <a
              href="profil.html?id=${profil.id || ""}"
              class="view-profile"
            >
              Voir le profil
            </a>

          </div>

        `;

        container.appendChild(card);

      });

    }


    /*
     * ==================================================
     * CHANGEMENT DE PAYS
     * ==================================================
     */

    document
      .getElementById("country")
      .addEventListener(
        "change",
        function () {

          chargerVilles(this.value);

        }
      );


    /*
     * ==================================================
     * BOUTON RECHERCHE
     * ==================================================
     */

    document
      .getElementById("searchButton")
      .addEventListener(
        "click",
        function () {

          const pays =
            document.getElementById("country").value;

          const ville =
            document.getElementById("city").value;

          chargerProfils(pays, ville);

        }
      );


    /*
     * ==================================================
     * INITIALISATION
     * ==================================================
     */

    async function initialiser() {

      await chargerPays();

      await chargerProfils();

    }

    initialiser();

  </script>

</body>
  </html>
