<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil - Affrilova</title>

<script src="https://cdn.jsdelivr.net/npm/appwrite@20.0.0"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--v:#20b486;--vf:#159b72;--m:#55d3a8;--p:#e8f8f2;--f:#f7fcfa;--t:#17352c;--g:#668078;--b:#ddefe8;--w:#fff}
body{font-family:Arial,sans-serif;background:var(--f);color:var(--t);padding-bottom:82px}
button{font:inherit;cursor:pointer}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes photo{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}

header{background:linear-gradient(135deg,var(--vf),var(--v),var(--m));color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px #159b7225}
.logo{font-size:20px;font-weight:bold}
.points{background:#ffffff2b;border:1px solid #ffffff40;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:bold}

main{max-width:700px;margin:auto;padding:17px 14px}
.back{display:inline-block;color:var(--vf);text-decoration:none;font-size:14px;font-weight:bold;margin-bottom:13px}
.card,.actions,.state{background:#fff;border:1px solid #ddefe8;border-radius:19px;box-shadow:0 6px 20px #12604812;animation:in .45s both}
.card{overflow:hidden;margin-bottom:15px}
.photo{width:100%;height:350px;object-fit:cover;background:var(--p);display:block;animation:photo .6s}
.content{padding:17px}
.name{font-size:23px;margin-bottom:5px}
.location{font-size:13px;color:var(--g);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.box{background:var(--p);border-radius:11px;padding:11px}
.box span{display:block;font-size:10px;color:var(--g);margin-bottom:4px}
.box strong{font-size:12px;color:var(--vf)}
.desc{background:var(--f);border:1px solid var(--b);border-radius:12px;padding:13px}
.desc strong{display:block;color:var(--vf);font-size:13px;margin-bottom:6px}
.desc p{font-size:13px;color:#55736a;line-height:1.5;white-space:pre-wrap}

.actions{padding:17px;text-align:center;animation-delay:.1s}
.note{font-size:13px;color:#55736a;line-height:1.5;margin-bottom:11px}
.buttons{display:flex;flex-direction:column;gap:9px}
.btn{width:100%;border:0;color:#fff;padding:13px;border-radius:12px;font-weight:bold;font-size:13px;transition:.2s}
.normal{background:linear-gradient(135deg,var(--vf),var(--v))}
.priority{background:linear-gradient(135deg,#159b72,#20b486)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.hint{font-size:10px;color:var(--g);margin-top:8px;line-height:1.4}
.priority-info{margin-top:10px;padding:10px;background:var(--p);border-radius:10px;color:#55736a;font-size:10px;text-align:left}
.success{background:var(--p);color:var(--vf);border:1px solid #cdefe1;border-radius:10px;padding:12px;font-size:12px;font-weight:bold}
.link{display:block;text-decoration:none;color:#fff;background:var(--vf);padding:13px;border-radius:12px;font-weight:bold;font-size:13px}
.state{text-align:center;padding:32px 18px;color:var(--g);font-size:13px;line-height:1.5}
#contenu{display:none}

.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fffffff7;border-top:1px solid var(--b);display:flex;z-index:20;box-shadow:0 -4px 15px #12604810}
.nav a{flex:1;text-decoration:none;color:var(--g);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:bold}
.nav a span{font-size:20px}
.nav a.active,.nav a:hover{color:var(--vf)}

@media(min-width:700px){
.nav{max-width:700px;left:50%;right:auto;width:100%;transform:translateX(-50%);border-radius:15px 15px 0 0}
.photo{height:400px}
}
@media(max-width:400px){.photo{height:310px}}
</style>
</head>

<body>

<header>
<div class="logo">💚 Affrilova</div>
<div class="points">⭐ <span id="headerPoints">-</span> points</div>
</header>

<main>

<a href="explorer.html" class="back">← Retour à Explorer</a>

<div id="etat" class="state">
Chargement du profil...
</div>

<div id="contenu">

<div class="card">

<img id="photo" class="photo" src="" alt="Photo de profil">

<div class="content">

<h1 id="nom" class="name"></h1>

<p id="lieu" class="location"></p>

<div class="grid">

<div class="box">
<span>Âge</span>
<strong id="age">—</strong>
</div>

<div class="box">
<span>Relation recherchée</span>
<strong id="relation">—</strong>
</div>

<div class="box">
<span>Polygamie</span>
<strong id="polygamie">—</strong>
</div>

<div class="box">
<span>Enfants</span>
<strong id="enfants">—</strong>
</div>

</div>

<div class="desc">
<strong>À propos</strong>
<p id="description"></p>
</div>

</div>
</div>

<div id="actions" class="actions"></div>

</div>
</main>

<nav class="nav">
<a href="index.html"><span>🏠</span>Accueil</a>
<a href="explorer.html" class="active"><span>🔎</span>Explorer</a>
<a href="messagerie.html"><span>💬</span>Messagerie</a>
<a href="profil.html"><span>👤</span>Profil</a>
</nav>

<script>
const ENDPOINT="https://fra.cloud.appwrite.io/v1";
const PROJECT="6aac203e00209ccb3014";
const DATABASE="6aac2a200000e6be5877";
const PROFILS="6aac2b35002a0debbb85";
const PAYS="pays";
const VILLES="villes";
const POINTS="points";
const DEMANDES="demandes";
const CONVERSATIONS="conversations";
const FUNCTION_ID="6aaf8d3fdb99e41f0aaf";
const BUCKET="6aad2a754e0e095d6a9a";

const client=new Appwrite.Client()
.setEndpoint(ENDPOINT).setProject(PROJECT);

const account=new Appwrite.Account(client);
const db=new Appwrite.Databases(client);
const tables=new Appwrite.TablesDB(client);
const storage=new Appwrite.Storage(client);
const functions=new Appwrite.Functions(client);

let me=null,profil=null,solde=0,pays=[],villes=[];

const relations={
mariage:"💍 Mariage",
amoureuse:"🌹 Relation sans précipitation",
"relation sans précipitation":"🌹 Relation sans précipitation",
projet:"💕 Projet de vie à deux",
"projet de vie à deux":"💕 Projet de vie à deux"
};

const polygamies={
oui:"Oui",
non:"Non",
indifferent:"Indifférent"
};

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function etat(msg){
document.getElementById("etat").textContent=msg;
document.getElementById("etat").style.display="block";
document.getElementById("contenu").style.display="none";
}

async function chargerPaysVilles(){
try{
let p=await tables.listRows({
databaseId:DATABASE,
tableId:PAYS,
queries:[Appwrite.Query.limit(100)]
});
pays=p.rows;

let v=await tables.listRows({
databaseId:DATABASE,
tableId:VILLES,
queries:[Appwrite.Query.limit(300)]
});
villes=v.rows;
}catch(e){console.log(e)}
}

function paysNom(id){
return pays.find(x=>x.$id===id)?.nom||"";
}

function villeNom(id){
return villes.find(x=>x.$id===id)?.nom||"";
}

function photoURL(id){
if(!id)
return "https://via.placeholder.com/600x500/E8F8F2/159B72?text=Affrilova";
return storage.getFileView({
bucketId:BUCKET,
fileId:id
});
}

async function chargerSolde(){
if(!me)return;
try{
let r=await tables.listRows({
databaseId:DATABASE,
tableId:POINTS,
queries:[
Appwrite.Query.equal("userId",me.$id),
Appwrite.Query.limit(1)
]
});
solde=r.total?r.rows[0].solde||0:0;
}catch(e){solde=0}
document.getElementById("headerPoints").textContent=solde;
}

function afficherProfil(){

document.getElementById("photo").src=
photoURL(profil.photoPrincipale);

document.getElementById("nom").textContent=
profil.nom||"Profil";

let ville=villeNom(profil.villeId);
let paysNomme=paysNom(profil.paysId);

document.getElementById("lieu").textContent=
"📍 "+ville+(ville&&paysNomme?", ":"")+paysNomme;

document.getElementById("age").textContent=
profil.age?profil.age+" ans":"—";

document.getElementById("relation").textContent=
relations[profil.typeRelation]||"—";

document.getElementById("polygamie").textContent=
polygamies[profil.polygamie]||"—";

document.getElementById("enfants").textContent=
profil.aDesEnfants===true
?"👨‍👩‍👧 A des enfants"
:profil.aDesEnfants===false
?"N'a pas d'enfants"
:"—";

document.getElementById("description").textContent=
profil.description||"";

document.getElementById("etat").style.display="none";
document.getElementById("contenu").style.display="block";
}
  async function appelerFonction(data){
  const r=await functions.createExecution({
    functionId:FUNCTION_ID,
    body:JSON.stringify(data),
    method:"POST"
  });

  let x;
  try{x=JSON.parse(r.responseBody)}
  catch(e){throw new Error("Réponse invalide du serveur.")}

  if(!x.ok)throw new Error(x.message||"Une erreur est survenue.");
  return x;
}

async function etatRelation(moi,autre){

  try{

    let c=await tables.listRows({
      databaseId:DATABASE,
      tableId:CONVERSATIONS,
      queries:[
        Appwrite.Query.equal("utilisateur1Id",moi),
        Appwrite.Query.equal("utilisateur2Id",autre),
        Appwrite.Query.limit(1)
      ]
    });

    if(c.total)return"conversation";

    c=await tables.listRows({
      databaseId:DATABASE,
      tableId:CONVERSATIONS,
      queries:[
        Appwrite.Query.equal("utilisateur1Id",autre),
        Appwrite.Query.equal("utilisateur2Id",moi),
        Appwrite.Query.limit(1)
      ]
    });

    if(c.total)return"conversation";

    let d=await tables.listRows({
      databaseId:DATABASE,
      tableId:DEMANDES,
      queries:[
        Appwrite.Query.equal("expediteurId",moi),
        Appwrite.Query.equal("destinataireId",autre),
        Appwrite.Query.equal("statut","en_attente"),
        Appwrite.Query.limit(1)
      ]
    });

    if(d.total)return"envoyee";

    d=await tables.listRows({
      databaseId:DATABASE,
      tableId:DEMANDES,
      queries:[
        Appwrite.Query.equal("expediteurId",autre),
        Appwrite.Query.equal("destinataireId",moi),
        Appwrite.Query.equal("statut","en_attente"),
        Appwrite.Query.limit(1)
      ]
    });

    if(d.total)return"recue";

  }catch(e){
    console.log("Etat relation:",e);
  }

  return"libre";
}


function succes(msg){

  document.getElementById("actions").innerHTML=
  `<div class="success">${esc(msg)}</div>`;

}


function lien(msg,url){

  document.getElementById("actions").innerHTML=
  `<a class="link" href="${url}">${esc(msg)}</a>`;

}


async function preparerActions(){

  const box=document.getElementById("actions");

  box.innerHTML="";

  if(!me){

    box.innerHTML=`
      <p class="note">
        Connectez-vous pour envoyer une demande de discussion.
      </p>
      <a class="link" href="profil.html">
        👤 Se connecter
      </a>
    `;

    return;
  }


  if(profil.userId===me.$id){

    box.innerHTML=`
      <p class="note">
        Vous consultez votre propre profil.
      </p>
      <a class="link" href="profil.html">
        ✏️ Modifier mon profil
      </a>
    `;

    return;
  }


  const etat=await etatRelation(
    me.$id,
    profil.userId
  );


  if(etat==="conversation"){

    lien(
      "💬 Ouvrir la conversation",
      "messagerie.html"
    );

    return;
  }


  if(etat==="envoyee"){

    succes(
      "✅ Votre demande a déjà été envoyée. En attente de sa réponse."
    );

    return;
  }


  if(etat==="recue"){

    lien(
      "📩 Voir la demande dans la messagerie",
      "messagerie.html"
    );

    return;
  }


  if(solde<1){

    box.innerHTML=`
      <p class="note">
        Il vous faut au moins 1 point pour envoyer une demande.
      </p>
      <a class="link" href="profil.html">
        ⭐ Acheter des points
      </a>
    `;

    return;
  }


  box.innerHTML=`
    <p class="note">
      Vous pouvez envoyer une demande pour commencer une discussion.
    </p>

    <div class="buttons">

      <button
        class="btn normal"
        id="btnNormal"
        onclick="envoyerDemande(false)">
        💬 Demande normale — 1 point
      </button>

      <button
        class="btn priority"
        id="btnPrioritaire"
        ${solde<2?"disabled":""}
        onclick="envoyerDemande(true)">
        ⭐ Demande prioritaire — 2 points
      </button>

    </div>

    <p class="hint">
      Solde actuel : ${solde} point${solde>1?"s":""}.
    </p>

    <div class="priority-info">
      ⭐ La demande prioritaire coûte 2 points et est enregistrée
      comme prioritaire.
      ${solde<2?" Vous avez besoin de 2 points pour l'utiliser.":""}
    </div>
  `;
}


async function envoyerDemande(prioritaire){

  const cout=prioritaire?2:1;

  if(solde<cout){

    alert(
      "Vous n'avez pas assez de points pour cette demande."
    );

    return;
  }


  const nom=profil.nom||"cette personne";

  const ok=confirm(
    (prioritaire
      ?"Envoyer une demande prioritaire"
      :"Envoyer une demande de discussion")
    +" à "+nom+" ?\n\n"
    +"Coût : "+cout+" point"
    +(cout>1?"s":"")+"."
  );

  if(!ok)return;


  const bouton=document.getElementById(
    prioritaire
      ?"btnPrioritaire"
      :"btnNormal"
  );


  if(bouton){

    bouton.disabled=true;
    bouton.textContent="Envoi en cours…";

  }


  try{

    const resultat=await appelerFonction({

      action:"envoyerDemande",

      peerId:profil.userId,

      prioritaire:prioritaire

    });


    /*
      Le backend reste la source de vérité.
      Si un nouveau solde est renvoyé,
      on l'utilise directement.
    */

    if(resultat.nouveauSolde!==undefined){

      solde=Number(
        resultat.nouveauSolde
      );

    }else{

      solde-=cout;

    }


    document.getElementById(
      "headerPoints"
    ).textContent=solde;


    succes(
      prioritaire
        ?"⭐ Demande prioritaire envoyée ! Vous serez prévenu(e) de la réponse."
        :"✅ Demande envoyée ! Vous serez prévenu(e) de la réponse."
    );


  }catch(e){

    console.error(
      "Erreur demande:",
      e
    );

    alert(
      "Impossible d'envoyer la demande :\n"+
      e.message
    );

    await chargerSolde();

    await preparerActions();

  }

}


async function chargerPage(){

  const params=
    new URLSearchParams(
      location.search
    );

  const id=params.get("id");


  if(!id){

    etat("Profil introuvable.");

    return;
  }


  await chargerPaysVilles();


  try{

    me=await account.get();

  }catch(e){

    me=null;

  }


  try{

    profil=await tables.getRow({

      databaseId:DATABASE,

      tableId:PROFILS,

      rowId:id

    });

  }catch(e){

    console.error(
      "Profil:",
      e
    );

    etat(
      "Ce profil est introuvable."
    );

    return;
  }


  /*
    Un profil approuvé est visible par les autres.
    L'utilisateur peut toujours voir son propre profil.
  */

  if(
    profil.statut!=="approuve" &&
    (!me||profil.userId!==me.$id)
  ){

    etat(
      "Ce profil n'est pas disponible."
    );

    return;
  }


  afficherProfil();


  if(me){

    await chargerSolde();

  }


  await preparerActions();

}


document.addEventListener(
  "DOMContentLoaded",
  chargerPage
);

</script>

</body>
</html>
